<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Colorly — a simple and intuitive random color generator."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />

    <title>Colorly — Random Color Generator</title>

    <link href="css/styles.css" rel="stylesheet" />
  </head>
  <body>
    <header class="header">
      <div class="header__container">
        <a href="/" class="header__brand">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            class="header__logo"
          >
            <path
              d="M9.38 21.646A10 10 0 0 0 12 22l.141-.001a3 3 0 0 0 2.515-1.425c.542-.876.6-1.953.153-2.88l-.198-.415c-.453-.942-.097-1.796.388-2.281s1.341-.841 2.28-.388h.001l.413.199a2.99 2.99 0 0 0 2.881-.153A3 3 0 0 0 22 12.141a10 10 0 0 0-.353-2.76c-1.038-3.827-4.353-6.754-8.246-7.285-3.149-.427-6.241.602-8.471 2.833S1.666 10.247 2.096 13.4c.53 3.894 3.458 7.208 7.284 8.246M15.5 6a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3m-5-1a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3M9 15.506a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m-2.5-6.5a1.5 1.5 0 1 1-.001 3.001A1.5 1.5 0 0 1 6.5 9.006"
            />
          </svg>
          <span class="header__title">Colorly</span>
        </a>
      </div>
    </header>

    <main>
      <section class="color-generator">
        <h1 class="sr-only">Random Color Generator</h1>
        <div class="color-generator__color">
          <div class="color-generator__glow"></div>

          <div
            class="color-generator__swatch"
            style="background-color: #ff5733"
          ></div>
        </div>

        <div class="color-generator__controls">
          <div class="color-generator__formats">
            <button
              class="color-generator__format color-generator__format--active"
              type="button"
              aria-pressed="true"
            >
              HEX
            </button>
            <button
              class="color-generator__format"
              type="button"
              aria-pressed="false"
            >
              RGB
            </button>
            <button
              class="color-generator__format"
              type="button"
              aria-pressed="false"
            >
              HSL
            </button>
          </div>

          <div class="color-generator__value">
            <div class="color-generator__code">
              <output
                class="color-generator__hex"
                aria-live="polite"
                aria-label="Current color"
                >#FF5733</output
              >

              <button
                class="color-generator__copy"
                title="Copy Color Code"
                type="button"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  aria-hidden="true"
                >
                  <path
                    d="M14 8H4c-1.103 0-2 .897-2 2v10c0 1.103.897 2 2 2h10c1.103 0 2-.897 2-2V10c0-1.103-.897-2-2-2"
                  />
                  <path
                    d="M20 2H10a2 2 0 0 0-2 2v2h8a2 2 0 0 1 2 2v8h2a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2"
                  />
                </svg>
              </button>
            </div>

            <p class="color-generator__hint">Click to copy code</p>
          </div>

          <button class="color-generator__generate" type="button">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              aria-hidden="true"
            >
              <path
                d="M17 17h-1.559l-9.7-10.673A1 1 0 0 0 5.001 6H2v2h2.559l4.09 4.5-4.09 4.501H2v2h3.001a1 1 0 0 0 .74-.327L10 13.987l4.259 4.686a1 1 0 0 0 .74.327H17v3l5-4-5-4z"
              />
              <path
                d="M15.441 8H17v3l5-3.938L17 3v3h-2.001a1 1 0 0 0-.74.327l-3.368 3.707 1.48 1.346z"
              />
            </svg>
            <span>Generate New Color</span>
          </button>
        </div>
      </section>

      <section class="color-generator__channels">
        <h2 class="sr-only">RGB Color Channels</h2>

        <div class="color-generator__channel-list">
          <article
            class="color-generator__channel color-generator__channel--red"
          >
            <span class="color-generator__channel-name">RED</span>

            <span class="color-generator__channel-value">255</span>

            <div class="color-generator__channel-bar">
              <div
                class="color-generator__channel-progress"
                style="width: 100%"
              ></div>
            </div>
          </article>

          <article
            class="color-generator__channel color-generator__channel--green"
          >
            <span class="color-generator__channel-name">GREEN</span>

            <span class="color-generator__channel-value">87</span>

            <div class="color-generator__channel-bar">
              <div
                class="color-generator__channel-progress"
                style="width: 34%"
              ></div>
            </div>
          </article>

          <article
            class="color-generator__channel color-generator__channel--blue"
          >
            <span class="color-generator__channel-name">BLUE</span>

            <span class="color-generator__channel-value">51</span>

            <div class="color-generator__channel-bar">
              <div
                class="color-generator__channel-progress"
                style="width: 20%"
              ></div>
            </div>
          </article>
        </div>
      </section>

      <section class="color-history">
        <header class="color-history__header">
          <div class="color-history__heading">
            <h2 class="color-history__title">Recent Colors</h2>
            <p class="color-history__description">
              History of generated palettes
            </p>
          </div>

          <button class="color-history__clear" type="button">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
            >
              <path
                d="M6 7H5v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7zm4 12H8v-9h2zm6 0h-2v-9h2zm.618-15L15 2H9L7.382 4H3v2h18V4z"
              />
            </svg>
            <span>Clear History</span>
          </button>
        </header>

        <div class="color-history__list">
          <button class="color-history__item" type="button">
            <div
              class="color-history__swatch"
              aria-hidden="true"
              style="background-color: #33ff57"
            ></div>

            <div class="color-history__info">
              <span class="color-history__code">#33FF57</span>
              <span class="color-history__time">10:42 AM</span>
            </div>
          </button>

          <button class="color-history__item" type="button">
            <div
              class="color-history__swatch"
              aria-hidden="true"
              style="background-color: #3357ff"
            ></div>

            <div class="color-history__info">
              <span class="color-history__code">#3357FF</span>
              <span class="color-history__time">10:41 AM</span>
            </div>
          </button>

          <button class="color-history__item" type="button">
            <div
              class="color-history__swatch"
              aria-hidden="true"
              style="background-color: #f333ff"
            ></div>

            <div class="color-history__info">
              <span class="color-history__code">#F333FF</span>
              <span class="color-history__time">10:39 AM</span>
            </div>
          </button>

          <button class="color-history__item" type="button">
            <div
              class="color-history__swatch"
              aria-hidden="true"
              style="background-color: #ffd433"
            ></div>

            <div class="color-history__info">
              <span class="color-history__code">#FFD433</span>
              <span class="color-history__time">10:35 AM</span>
            </div>
          </button>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="footer__container">
        <p class="footer__copyright">Made with care by Colorly · 2026</p>

        <a
          href="https://github.com/juanfeoru/colorly"
          class="footer__link"
          aria-label="Colorly on GitHub"
          target="_blank"
          rel="noreferrer noopener"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path
              d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.5 11.5 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12"
            />
          </svg>
        </a>
      </div>
    </footer>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
